# Kalla-Lai web edge: serves the Flutter bundle and proxies the API.
#
# TLS is terminated by the platform load balancer / Kubernetes ingress in the
# default deployment. See tls.conf.example for a host-level TLS listener.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Only credential endpoints are counted; every other request uses an empty key.
map $uri $auth_limit_key {
  default                                  '';
  ~^/v1/auth/(login|register|refresh)$     $binary_remote_addr;
}

limit_req_zone $auth_limit_key zone=auth_limit:10m rate=20r/m;
limit_req_status 429;

upstream api_backend {
  server api:8080;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  # Google sign-in opens a popup, so COOP must allow popups. Do not change to
  # same-origin: Firebase/Google authentication would stop working.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.gstatic.com https://*.googleapis.com https://maps.googleapis.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; worker-src 'self' blob:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # WebSocket endpoint for live shift/payment events.
  location = /v1/ws {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /v1/ {
    limit_req zone=auth_limit burst=10 nodelay;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # The Flutter entry point and service worker must be revalidated so a new
  # release is picked up; hashed/static assets can be cached.
  location = /index.html {
    expires -1;
  }

  location = /flutter_service_worker.js {
    expires -1;
  }

  location ~* \.(?:js|json|wasm)$ {
    expires -1;
  }

  location ~* \.(?:css|png|jpg|jpeg|gif|svg|webp|ico|otf|ttf|woff2?)$ {
    expires 30d;
  }

  location = /assets/assets/videos/output.mp4 {
    expires 7d;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
