global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: kalla-lai

rule_files:
  - /etc/prometheus/alerts.yml

# Add an alertmanager block when one is deployed:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kalla-lai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
    # If METRICS_TOKEN is configured, mount the token and enable:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
