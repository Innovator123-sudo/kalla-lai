<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A trusted work marketplace connecting verified workers with employers across Nepal.">
  <meta name="theme-color" content="#4F46E5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="कल्ला-लाई — Kalla-Lai">
  <meta property="og:description" content="A trusted work marketplace connecting verified workers with employers across Nepal.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kalla-Lai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>कल्ला-लाई</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Same colour as the intro clip, so loading runs straight into it. */
      background: #efedea;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #boot::after {
      content: '';
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(79, 70, 229, 0.2);
      border-top-color: #4f46e5;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="boot" role="progressbar" aria-label="Loading Kalla-Lai"></div>
  <noscript>Kalla-Lai needs JavaScript. Please enable it in your browser and reload this page.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script>
    // Cache reset for clients that still have the old Cloudflare tunnel build
    // cached by Flutter's service worker. The retired URL is no longer compiled
    // into the app; clearing the worker, its caches, and the old override key
    // makes sure every browser fetches the current bundle after this deploy.
    //
    // A client whose old worker cached index.html will not see this script
    // until the worker updates. Opening the page once with `?fresh=1` bypasses
    // that cache (different query string) and lets this cleanup run.
    (function () {
      if (['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1) {
        return;
      }
      var key = 'kalla_lai.web_cache_version';
      var version = '2026-11-11-intro-autoplay-1';
      var fresh = location.search.indexOf('fresh=1') !== -1;
      try {
        // The old build let users save an API URL in local storage. Nothing
        // reads it now, but delete it so a stale value cannot linger.
        localStorage.removeItem('kalla_lai.api_url.v1');
        if (localStorage.getItem(key) === version) return;
      } catch (e) {
        // Storage is unavailable (private mode, blocked cookies). Loading the
        // current bundle is still possible, so keep going.
      }
      var cleared = false;
      var finish = function () {
        try {
          localStorage.setItem(key, version);
        } catch (e) {
          // Ignore storage failures.
        }
        // Reload only when an old worker or cache was really removed. A first
        // visit has neither, and must not load the whole app twice.
        if (cleared && !fresh) {
          location.replace(location.pathname + '?fresh=1' + location.hash);
        }
        // When the URL already has `?fresh=1` there is no second navigation:
        // the caches are empty now, so the browser fetches the new bundle.
      };
      var jobs = [];
      if ('serviceWorker' in navigator) {
        jobs.push(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (regs.length) cleared = true;
            return Promise.all(
              regs.map(function (reg) { return reg.unregister(); })
            );
          })
        );
      }
      if (window.caches) {
        jobs.push(
          caches.keys().then(function (keys) {
            if (keys.length) cleared = true;
            return Promise.all(
              keys.map(function (name) { return caches.delete(name); })
            );
          })
        );
      }
      var timer = setTimeout(finish, 2500);
      Promise.all(jobs).catch(function () {}).then(function () {
        clearTimeout(timer);
        finish();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
